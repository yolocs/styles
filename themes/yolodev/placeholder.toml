format = "yolodev-terminal-theme"
version = 1

[theme]
name = "yolodev"
variant = "placeholder"
appearance = "dark"
description = "Temporary palette used while yolodev is bootstrapped."

[colors]
background = "#222436"
foreground = "#C8D3F5"
cursor = "#FFC777"
cursor_text = "#222436"
selection_background = "#444A73"
selection_foreground = "#C8D3F5"

[palette.normal]
black = "#1B1D2B"
red = "#FF757F"
green = "#C3E88D"
yellow = "#FFC777"
blue = "#82AAFF"
magenta = "#C099FF"
cyan = "#86E1FC"
white = "#C8D3F5"

[palette.bright]
black = "#444A73"
red = "#FF757F"
green = "#C3E88D"
yellow = "#FFC777"
blue = "#82AAFF"
magenta = "#C099FF"
cyan = "#86E1FC"
white = "#FFFFFF"
